<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Emtiaz Organs Series</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #fff; }
  .post { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #fff; font-family: var(--font-body); color: var(--emtiaz-ink); }

  /* photo area */
  .photo { position: absolute; top: 0; left: 0; right: 0; height: 860px; overflow: hidden; background: #2B3163; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo::after { /* soft navy grade at the bottom so the panel joins cleanly */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(26,31,69,.28) 0, rgba(26,31,69,0) 22%, rgba(26,31,69,0) 70%, rgba(26,31,69,.35) 100%);
  }
  .placeholder {
    width: 100%; height: 100%; display: grid; place-items: center; text-align: center; padding: 120px;
    background: radial-gradient(circle at 60% 40%, #5A5E85 0, #2B3163 55%, #12152E 100%);
    font-family: var(--font-display); font-weight: 600; font-size: 34px; line-height: 1.6; color: #fff;
  }
  .placeholder small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 24px; color: var(--navy-200); margin-top: 12px; }

  .logo-badge {
    position: absolute; top: 48px; right: 56px; width: 150px; height: 150px; border-radius: 50%;
    background: #fff; display: grid; place-items: center; box-shadow: 0 12px 30px rgba(18,21,46,.25); z-index: 3;
  }
  .logo-badge img { width: 132px; height: 132px; border-radius: 50%; }

  /* red lens from the logo orbit */
  .lens { position: absolute; z-index: 2; pointer-events: none; }
  .chip {
    position: absolute; z-index: 3; direction: ltr; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 20px; border-radius: 14px;
    background: rgba(255,255,255,.94); backdrop-filter: blur(8px);
    box-shadow: 0 14px 30px rgba(18,21,46,.22);
    font-family: var(--font-mono); font-weight: 600; font-size: 23px; color: var(--emtiaz-navy);
  }
  .chip b { color: var(--emtiaz-red); font-weight: 600; }

  /* text panel */
  .panel {
    position: absolute; left: 0; right: 0; top: 800px; bottom: 0; background: #fff;
    border-radius: 48px 48px 0 0; padding: 52px 72px 0; z-index: 2;
  }
  .eyebrow { font-family: var(--font-mono); font-weight: 600; font-size: 21px; letter-spacing: .18em; color: var(--emtiaz-red); direction: ltr; text-align: right; }
  .headline { margin-top: 14px; font-family: var(--font-display); font-weight: 700; color: var(--emtiaz-navy); font-size: 66px; line-height: 1.2; }
  .headline em { font-style: normal; color: var(--emtiaz-red); }
  .sub { margin-top: 14px; font-weight: 500; font-size: 28px; color: var(--navy-400); }

  .bottom {
    position: absolute; bottom: 52px; right: 72px; left: 72px; height: 104px; z-index: 3;
    background: var(--emtiaz-navy); border-radius: 26px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 34px;
  }
  .tagline { font-family: var(--font-display); font-weight: 600; font-size: 28px; color: #fff; }
  .tagline span { color: var(--red-300); }
  .phone { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 999px; padding: 12px 26px;
    font-family: var(--font-mono); font-weight: 600; font-size: 30px; color: var(--emtiaz-navy); direction: ltr; }
  .phone small { font-family: var(--font-body); font-weight: 500; font-size: 21px; color: var(--navy-400); direction: rtl; }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="photo" id="photo"></div>
  <div class="logo-badge"><img src="../../assets/logo.jpg" alt="معمل امتياز"></div>
  <svg class="lens" id="lens" aria-hidden="true"></svg>
  <div id="chips"></div>

  <div class="panel">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 class="headline" id="headline"></h1>
    <div class="sub" id="sub"></div>
  </div>

  <div class="bottom">
    <div class="tagline">نتيجة دقيقة.. <span>تطمّن قلبك</span></div>
    <div class="phone"><small>احجز واتساب</small>01141130500</div>
  </div>
</div>

<script>
/* lens: [cx, cy, r] in canvas px — the red orbit circles the focal point of each photo */
const DESIGNS = {
  liver: {
    eyebrow: "LIVER FUNCTION",
    headline: 'بيشيل عنك كتير..<br>و<em>مبيشتكيش</em>',
    sub: "زي الكبد بالظبط. اطمّن عليه بتحليل وظائف الكبد",
    img: "img/liver.jpg",
    scene: "أب شايل بنته على كتافه<br>في شارع منوّر بالليل<small>صورة واقعية — هتتولد بالـ Prompt رقم 1</small>",
    lens: [470, 330, 300],
    chips: [["ALT", 820, 300], ["AST", 850, 390], ["Bilirubin", 790, 560], ["Albumin", 810, 650]]
  },
  kidney: {
    eyebrow: "KIDNEY FUNCTION",
    headline: 'زي الزير..<br>كليتك <em>بتصفّي</em> في صمت',
    sub: "فلتر شغال 24 ساعة. اطمّن عليه بتحاليل وظائف الكلى",
    img: "img/kidney.jpg",
    scene: "إيدين ست كبيرة بتصبّ مية<br>من زير فخار في كوباية<small>صورة واقعية — هتتولد بالـ Prompt رقم 2</small>",
    lens: [540, 470, 230],
    chips: [["Creatinine", 80, 300], ["Urea", 110, 390], ["eGFR", 820, 560], ["Uric Acid", 770, 650]]
  },
  hpylori: {
    eyebrow: "H. PYLORI",
    headline: 'في ضيف على السفرة..<br><em>مش باين</em>',
    sub: "تحليل جرثومة المعدة: أنتيجين في البراز",
    img: "img/hpylori.jpg",
    scene: "سفرة عيلة مصرية من فوق<br>وإيدين كتير بتاخد من نفس الأطباق<small>صورة واقعية — هتتولد بالـ Prompt رقم 3</small>",
    lens: [600, 470, 170],
    chips: [["H. pylori Ag", 760, 300], ["Stool Antigen", 70, 660]]
  }
};
const key = new URLSearchParams(location.search).get("d") || "liver";
const d = DESIGNS[key];
document.getElementById("eyebrow").textContent = d.eyebrow;
document.getElementById("headline").innerHTML = d.headline;
document.getElementById("sub").textContent = d.sub;

const photo = document.getElementById("photo");
const img = new Image();
img.alt = "";
img.onload = () => photo.replaceChildren(img);
img.onerror = () => { photo.innerHTML = `<div class="placeholder"><div>${d.scene}</div></div>`; };
img.src = d.img;

const [cx, cy, r] = d.lens;
const lens = document.getElementById("lens");
lens.setAttribute("width", 1080); lens.setAttribute("height", 860);
lens.setAttribute("viewBox", "0 0 1080 860");
lens.style.left = 0; lens.style.top = 0;
const a0 = 200 * Math.PI / 180, a1 = 500 * Math.PI / 180; // ~300° arc, open at the top-right like the logo
const p = a => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
const [x0, y0] = p(a0), [x1, y1] = p(a1);
const dots = [520, 538, 556].map(deg => p(deg * Math.PI / 180));
lens.innerHTML = `
  <path d="M ${x0} ${y0} A ${r} ${r} 0 1 1 ${x1} ${y1}" fill="none" stroke="#E0302A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="${x0}" cy="${y0}" r="11" fill="#E0302A"/><circle cx="${x1}" cy="${y1}" r="11" fill="#E0302A"/>
  ${dots.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="7" fill="#E0302A"/>`).join("")}`;

const chips = document.getElementById("chips");
for (const [t, x, y] of d.chips) {
  const c = document.createElement("div");
  c.className = "chip"; c.style.left = x + "px"; c.style.top = y + "px";
  c.innerHTML = `<b>✓</b>${t}`;
  chips.appendChild(c);
}
document.fonts.ready.then(() => document.body.dataset.ready = "1");
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Emtiaz Organs Series</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; background: #12152E; }
  .post {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    background: #12152E; color: #fff; font-family: var(--font-body);
  }

  /* photo: top of the canvas, melting into deep navy */
  .photo {
    position: absolute; top: 0; left: 0; width: 1080px; height: 900px;
    -webkit-mask-image: linear-gradient(180deg, #000 0, #000 58%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 0, #000 58%, transparent 100%);
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shade { position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(18,21,46,.55) 0, rgba(18,21,46,0) 18%),
      linear-gradient(180deg, rgba(18,21,46,0) 45%, rgba(18,21,46,.85) 78%, #12152E 100%); }
  .placeholder { width: 100%; height: 100%; background: radial-gradient(circle at 50% 40%, #5A5E85, #2B3163 60%, #12152E); }

  /* top bar */
  .logo { position: absolute; top: 56px; right: 72px; width: 124px; height: 124px; border-radius: 50%;
    background: #fff; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .logo img { width: 112px; height: 112px; border-radius: 50%; }
  .topic { position: absolute; top: 92px; left: 72px; display: flex; align-items: center; gap: 14px;
    padding: 14px 26px; border-radius: 999px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-family: var(--font-display); font-weight: 600; font-size: 24px; letter-spacing: 0; }
  .topic i { width: 10px; height: 10px; border-radius: 50%; background: var(--emtiaz-red); }

  /* copy block */
  .copy { position: absolute; right: 72px; left: 72px; bottom: 306px; }
  .kicker { display: flex; align-items: center; gap: 16px;
    font-family: var(--font-display); font-weight: 600; font-size: 26px; color: var(--red-300); }
  .kicker::before { content: ""; width: 48px; height: 4px; border-radius: 2px; background: var(--emtiaz-red); }
  .headline { margin-top: 20px; font-family: var(--font-display); font-weight: 700;
    font-size: 88px; line-height: 1.12; letter-spacing: -.005em; }
  .headline em { font-style: normal; color: var(--emtiaz-red); }
  .sub { margin-top: 24px; font-weight: 400; font-size: 30px; line-height: 1.55; color: rgba(255,255,255,.78); max-width: 860px; }

  /* tests strip (the lab-report motif, refined) */
  .tests { position: absolute; right: 72px; left: 72px; bottom: 190px; display: flex; align-items: center;
    border-top: 1px solid rgba(255,255,255,.16); border-bottom: 1px solid rgba(255,255,255,.16); height: 76px; }
  .tests .label { font-family: var(--font-display); font-weight: 600; font-size: 22px; color: rgba(255,255,255,.6); padding-left: 28px; white-space: nowrap; }
  .tests .list { display: flex; flex: 1; direction: ltr; justify-content: flex-end; }
  .tests .t { padding: 0 22px; font-family: var(--font-body); font-weight: 500; font-size: 24px; color: #fff;
    border-left: 1px solid rgba(255,255,255,.18); white-space: nowrap; }
  .tests .t:first-child { border-left: 0; }

  /* footer */
  .footer { position: absolute; right: 72px; left: 72px; bottom: 64px; display: flex; align-items: center; justify-content: space-between; }
  .tagline { font-family: var(--font-display); font-weight: 600; font-size: 28px; color: #fff; }
  .tagline span { color: var(--red-300); }
  .cta { display: flex; align-items: center; gap: 16px; padding: 16px 30px 16px 22px; border-radius: 999px; background: #fff; color: var(--emtiaz-navy); }
  .cta .ic { width: 46px; height: 46px; border-radius: 50%; background: var(--emtiaz-red); display: grid; place-items: center; }
  .cta .num { font-family: var(--font-display); font-weight: 700; font-size: 34px; letter-spacing: .02em; direction: ltr; font-variant-numeric: lining-nums tabular-nums; }
  .cta small { font-family: var(--font-body); font-weight: 500; font-size: 20px; color: var(--navy-400); display: block; line-height: 1.1; }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="photo" id="photo"></div>
  <div class="shade"></div>

  <div class="logo"><img src="../../assets/logo.jpg" alt="معمل امتياز"></div>

  <div class="copy">
    <div class="kicker" id="kicker"></div>
    <h1 class="headline" id="headline"></h1>
    <p class="sub" id="sub"></p>
  </div>

  <div class="tests"><div class="label" id="tlabel"></div><div class="list" id="tests"></div></div>

  <div class="footer">
    <div class="cta">
      <div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg></div>
      <div><small>احجز واتساب</small><div class="num">01141130500</div></div>
    </div>
    <div class="tagline">نتيجة دقيقة.. <span>تطمّن قلبك</span></div>
  </div>
</div>

<script>
const DESIGNS = {
  liver: {
    topic: "وظائف الكبد", kicker: "الكبد",
    headline: 'بيشيل عنك كتير..<br>و<em>مبيشتكيش</em>',
    sub: "زي الكبد بالظبط. اطمّن عليه بتحليل وظائف الكبد.",
    tlabel: "التحاليل", tests: ["ALT", "AST", "Bilirubin", "Albumin"],
    img: "img/liver.jpg", pos: "center 30%"
  },
  kidney: {
    topic: "وظائف الكلى", kicker: "الكلى",
    headline: 'زي الزير..<br>كليتك <em>بتصفّي</em> في صمت',
    sub: "فلتر شغال 24 ساعة.. اطمّن عليه بتحاليل وظائف الكلى.",
    tlabel: "التحاليل", tests: ["Creatinine", "Urea", "Uric Acid", "eGFR"],
    img: "img/kidney.jpg", pos: "center 40%"
  },
  hpylori: {
    topic: "جرثومة المعدة", kicker: "جرثومة المعدة",
    headline: 'في ضيف على السفرة..<br><em>مش باين</em>',
    sub: "مش كل ضيف بيستأذن قبل ما يدخل.. تحليل واحد يكشفه.",
    tlabel: "التحليل", tests: ["H. pylori Stool Antigen"],
    img: "img/hpylori.jpg", pos: "center 35%"
  }
};
const key = new URLSearchParams(location.search).get("d") || "liver";
const d = DESIGNS[key];
for (const id of ["kicker", "sub", "tlabel"]) document.getElementById(id).textContent = d[id];
document.getElementById("headline").innerHTML = d.headline;
document.getElementById("tests").innerHTML = d.tests.map(t => `<span class="t">${t}</span>`).join("");

const photo = document.getElementById("photo");
const img = new Image();
img.alt = "";
img.style.objectPosition = d.pos;
img.onload = () => photo.replaceChildren(img);
img.onerror = () => { photo.innerHTML = '<div class="placeholder"></div>'; };
img.src = d.img;
document.fonts.ready.then(() => {
  // keep the headline on 2 lines: shrink until it fits
  const h = document.getElementById("headline");
  let size = 88;
  while (h.getBoundingClientRect().height > size * 1.12 * 2 + 4 && size > 60) { size -= 2; h.style.fontSize = size + "px"; }
  document.body.dataset.ready = "1";
});
</script>
</body>
</html>
